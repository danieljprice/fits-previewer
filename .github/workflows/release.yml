name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CFITSIO
        run: brew install cfitsio

      - name: Test
        run: make test

      - name: Package
        id: package
        run: |
          ./scripts/package.sh
          sha=$(shasum -a 256 dist/FitsPreviewer.zip | awk '{print $1}')
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Upload zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/FitsPreviewer.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/FitsPreviewer.zip \
              --title "${GITHUB_REF_NAME}" --generate-notes
          fi

      - name: Bump Homebrew cask
        if: github.repository == 'danieljprice/fits-previewer'
        continue-on-error: true
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.BREW_TOKEN }}
        run: |
          git config --global user.email "daniel.price@monash.edu"
          git config --global user.name "Daniel Price"
          brew tap danieljprice/all
          brew trust danieljprice/all
          brew bump-cask-pr --no-browse --no-audit --no-fork \
            --version="${GITHUB_REF_NAME#v}" \
            --sha256="${{ steps.package.outputs.sha }}" \
            danieljprice/all/fits-previewer
